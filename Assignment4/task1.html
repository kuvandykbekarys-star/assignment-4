<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ticket-page">
  <main class="container py-4 py-md-5">
    <nav class="mb-4 d-flex flex-wrap gap-3" aria-label="Assignments">
      <a href="task1.html">Task 1</a>
      <a href="task2.html">Task 2</a>
      <a href="task3.html">Task 3</a>
      <a href="problems.html">Task 3 problems</a>
    </nav>
    <section class="ticket">
      <header class="ticket-header"><h1>Book a train ticket</h1></header>
      <form class="ticket-body" action="task1.html" method="get">
        <fieldset class="mb-4">
          <legend class="visually-hidden">Trip type</legend>
          <div class="btn-group trip-type">
            <input class="btn-check" type="radio" name="trip" id="one-way" value="one-way">
            <label class="btn btn-outline-success" for="one-way">One way</label>
            <input class="btn-check" type="radio" name="trip" id="round-trip" value="round-trip">
            <label class="btn btn-outline-success" for="round-trip">Round trip</label>
          </div>
        </fieldset>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="from" name="from" placeholder="Astana" required>
              <label for="from">From</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" required>
              <label for="to">To</label>
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="departure">Departure</label>
            <input type="date" class="form-control" id="departure" name="departure" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="return">Return</label>
            <input type="date" class="form-control" id="return" name="return">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="passengers">Passengers</label>
            <select class="form-select" id="passengers" name="passengers" required>
              <option value="">Choose adults</option>
              <option value="1">1 adult</option><option value="2">2 adults</option>
              <option value="3">3 adults</option><option value="4">4 adults</option>
              <option value="5">5 adults</option><option value="6">6 adults</option>
            </select>
          </div>
          <div class="col-12">
            <fieldset>
              <legend class="form-label">Carriage class</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                <label class="form-check-label" for="seat">Seat</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" required>
                <label class="form-check-label" for="coupe">Coupé</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper" required>
                <label class="form-check-label" for="sleeper">Sleeper</label>
              </div>
            </fieldset>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="phone">Phone</label>
            <div class="input-group">
              <span class="input-group-text" id="phone-prefix">+7</span>
              <input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel-national" aria-describedby="phone-prefix" required>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="col-12">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
              <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="accepted" required>
              <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
            </div>
          </div>
          <div class="col-12 ticket-actions">
            <button class="btn clear-button" type="reset">Clear</button>
            <button class="btn find-button" type="submit">Find trains</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
